name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - name: Korf pattern databases (build + optimal solves)
        run: cargo test --release -p gpss-puzzles -- --ignored korf
      - name: Benchmark counters vs committed baselines (machine-independent)
        run: cargo run --release -p gpss-bench -- check

  conformance:
    name: Conformance (Rust CLI vs reference model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: cargo build --release -p gpss-cli
      - name: IDA* + dual heuristic, full corpus
        run: python3 conformance/harness.py --impl gpss --no-build --solver idastar --heuristic dual
      - name: A* + dual heuristic, full corpus
        run: python3 conformance/harness.py --impl gpss --no-build --solver astar --heuristic dual
      - name: BFS, depth <= 8
        run: python3 conformance/harness.py --impl gpss --no-build --solver bfs --max-depth 8
      - name: 3x3x3 two-phase, full corpus
        run: python3 conformance/harness.py --impl gpss --no-build --solver twophase --corpus conformance/corpus/cube3.jsonl
      - name: 3x3x3 IDA* + Korf PDBs, exact cases (depth <= 7)
        run: python3 conformance/harness.py --impl gpss --no-build --solver idastar --heuristic korf --corpus conformance/corpus/cube3.jsonl --max-depth 7
      - name: 3x3x3 IDA* (no heuristic), depth <= 5
        run: python3 conformance/harness.py --impl gpss --no-build --solver idastar --heuristic zero --corpus conformance/corpus/cube3.jsonl --max-depth 5
      - name: Generic cuboids (AxBxC) IDA*, full corpus
        run: python3 conformance/harness.py --impl gpss --no-build --solver idastar --corpus conformance/corpus/cuboid.jsonl

  legacy:
    name: Legacy C++ baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and run edge cases and short scrambles
        run: python3 conformance/harness.py --impl legacy-cpp --solver astardual --max-depth 7

  learned:
    name: Learned solver (ONNX feature, trainer, shipped weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: learn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install CPU PyTorch, ONNX, ONNX Runtime
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r training/requirements.txt
      - run: cargo clippy --all-targets --features gpss-cli/learn -- -D warnings
      - run: cargo test --release -p gpss-learn -p gpss-cli --features gpss-cli/learn
      - run: cargo build --release -p gpss-cli --features learn
      - name: Trainer and launcher tests (cloud calls mocked)
        working-directory: training
        run: python -m pytest -q
      - name: BWAS + shipped 2x2x2 weights, full corpus
        run: >
          python3 conformance/harness.py --impl gpss --no-build --solver bwas
          --solver-arg=--weights=weights/cube2/cube2-davi-v1.json
          --solver-arg=--lambda=0.6 --solver-arg=--batch-size=100
      - name: BWAS lambda=1 + admissible dual heuristic is optimal, full corpus
        run: >
          python3 conformance/harness.py --impl gpss --no-build --solver bwas --heuristic dual
          --solver-arg=--lambda=1 --solver-arg=--batch-size=50 --expect-optimal

[workspace]
resolver = "2"
members = ["crates/gpss-core", "crates/gpss-puzzles", "crates/gpss-learn", "crates/gpss-cli", "crates/gpss-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/diodotos/geometry-puzzle-solver-suite"
rust-version = "1.75"

[workspace.dependencies]
gpss-core = { path = "crates/gpss-core" }
gpss-puzzles = { path = "crates/gpss-puzzles" }
gpss-learn = { path = "crates/gpss-learn" }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
proptest = "1"

[profile.release]
debug = 1
